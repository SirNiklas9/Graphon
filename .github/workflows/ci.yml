name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Odin build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, sirniklas-local]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Linux graphics toolchain
        run: |
          command -v clang
          command -v pkg-config
          pkg-config --exists alsa
          pkg-config --exists gl
          pkg-config --exists x11
          pkg-config --exists xcursor
          pkg-config --exists xi
          pkg-config --exists xinerama
          pkg-config --exists xrandr
      - name: Install verified Odin compiler
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/odin-lang/Odin/releases/download/dev-2026-09/odin-linux-amd64-dev-2026-09.tar.gz \
            --output "$RUNNER_TEMP/odin.tar.gz"
          echo "167c3e1d7056419dad2e04bb3bd98715b7ff286d4c125f3c5a5ee337c6254283  $RUNNER_TEMP/odin.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/odin"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: Check packages
        run: odin check . -collection:lib=lib
      - name: Build Graphon
        run: odin build . -out:graphon -collection:lib=lib
